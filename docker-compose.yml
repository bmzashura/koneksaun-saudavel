services:
  ks-dns:
    build:
      context: ./dns
      dockerfile: Dockerfile
    container_name: ks-dns
    ports:
      - "53:53/udp"
    volumes:
      - blocklists:/app/blocklists
      - dns_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('127.0.0.1', 53)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ks-network

  ks-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ks-web
    ports:
      - "8080:8080"
    volumes:
      - sqlite_db:/app/data
    restart: unless-stopped
    depends_on:
      ks-dns:
        condition: service_started
    networks:
      - ks-network

networks:
  ks-network:
    driver: bridge

volumes:
  blocklists:
  dns_logs:
  sqlite_db:
