<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Koneksaun Saudavel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-shield-check"></i> KS</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/reports/submit"><i class="bi bi-flag"></i> Submit Report</a>
                <a class="nav-link" href="/api/v1/auth/logout" onclick="fetch(this.href); location.href='/'; return false;"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4">Dashboard</h2>
        <div id="stats" class="row g-3 mb-4">
            <div class="col-md-4"><div class="card p-3 text-center"><h3 id="stat-reports">-</h3><small>My Reports</small></div></div>
            <div class="col-md-4"><div class="card p-3 text-center"><h3 id="stat-pending">-</h3><small>Pending</small></div></div>
            <div class="col-md-4"><div class="card p-3 text-center"><h3 id="stat-approved">-</h3><small>Approved</small></div></div>
        </div>

        <h4 class="mb-3">My Reports</h4>
        <div id="reports" class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>Domain</th><th>Category</th><th>Status</th><th>Created</th></tr></thead>
                <tbody id="reportsBody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load() {
            const res = await fetch("/api/v1/reports/mine");
            const reports = await res.json();
            let pending = 0, approved = 0;
            const tbody = document.getElementById("reportsBody");
            tbody.innerHTML = "";
            reports.forEach(r => {
                if (r.status === "pending") pending++;
                if (r.status === "approved") approved++;
                tbody.innerHTML += `<tr><td>${r.domain}</td><td>${r.category}</td><td><span class="badge bg-${r.status === 'approved' ? 'success' : r.status === 'rejected' ? 'danger' : 'warning'}">${r.status}</span></td><td>${r.created_at}</td></tr>`;
            });
            document.getElementById("stat-reports").textContent = reports.length;
            document.getElementById("stat-pending").textContent = pending;
            document.getElementById("stat-approved").textContent = approved;
        }
        load();
    </script>
</body>
</html>
