<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users - Koneksaun Saudavel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-shield-check"></i> KS Admin</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/reports">Reports</a>
                <a class="nav-link" href="/admin/users">Users</a>
                <a class="nav-link" href="/admin/settings">Settings</a>
                <a class="nav-link" href="/dashboard">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h3 class="mb-4">Admin: Users</h3>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>ID</th><th>Username</th><th>Admin</th><th>Created</th><th>Actions</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load() {
            const res = await fetch("/api/v1/admin/users");
            const users = await res.json();
            const tbody = document.getElementById("tbody");
            tbody.innerHTML = "";
            users.forEach(u => {
                tbody.innerHTML += `<tr>
                    <td>${u.id}</td>
                    <td>${u.username}</td>
                    <td>${u.is_admin ? '<span class="badge bg-danger">Admin</span>' : '<span class="badge bg-secondary">User</span>'}</td>
                    <td>${u.created_at}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="del(${u.id})">Delete</button></td>
                </tr>`;
            });
        }
        async function del(id) {
            if (confirm("Delete this user?")) {
                await fetch(`/api/v1/admin/users/${id}`, {method: "DELETE"});
                load();
            }
        }
        load();
    </script>
</body>
</html>
