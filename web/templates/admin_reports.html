<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Reports - Koneksaun Saudavel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-shield-check"></i> KS Admin</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/reports">Reports</a>
                <a class="nav-link" href="/admin/users">Users</a>
                <a class="nav-link" href="/admin/settings">Settings</a>
                <a class="nav-link" href="/dashboard">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h3 class="mb-4">Admin: Reports Queue</h3>
        <div id="reports" class="table-responsive">
            <table class="table table-striped table-hover">
                <thead><tr><th>Domain</th><th>Category</th><th>Reporter</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load() {
            const res = await fetch("/api/v1/reports");
            const reports = await res.json();
            const tbody = document.getElementById("tbody");
            tbody.innerHTML = "";
            reports.filter(r => r.status === "pending").forEach(r => {
                tbody.innerHTML += `<tr>
                    <td>${r.domain}</td>
                    <td>${r.category}</td>
                    <td>${r.reporter_id}</td>
                    <td><span class="badge bg-warning">${r.status}</span></td>
                    <td>${r.created_at}</td>
                    <td>
                        <button class="btn btn-sm btn-success" onclick="action(${r.id}, 'approve')">✓ Approve</button>
                        <button class="btn btn-sm btn-danger" onclick="action(${r.id}, 'reject')">✗ Reject</button>
                    </td>
                </tr>`;
            });
        }
        async function action(id, act) {
            await fetch(`/api/v1/admin/reports/${id}/${act}`, {method: "POST"});
            load();
        }
        load();
    </script>
</body>
</html>
