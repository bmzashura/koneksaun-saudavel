<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings - Koneksaun Saudavel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-shield-check"></i> KS Admin</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/reports">Reports</a>
                <a class="nav-link" href="/admin/users">Users</a>
                <a class="nav-link" href="/admin/settings">Settings</a>
                <a class="nav-link" href="/dashboard">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h3 class="mb-4">Admin: Settings</h3>
        <div class="card">
            <div class="card-body">
                <h5>Category Filters</h5>
                <p class="text-muted">Toggle blocking categories.</p>
                <div id="categories" class="list-group"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function load() {
            const res = await fetch("/api/v1/categories");
            const cats = await res.json();
            const div = document.getElementById("categories");
            div.innerHTML = "";
            cats.forEach(c => {
                div.innerHTML += `<div class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>${c.name}</strong>
                    <span class="badge bg-${c.enabled ? 'success' : 'secondary'}">${c.enabled ? 'Enabled' : 'Disabled'}</span>
                </div>`;
            });
        }
        load();
    </script>
</body>
</html>
