# GitLab CI/CD Pipeline for Koneksaun Saudavel
# Polyrepo-friendly template with SonarQube integration
# Generated by Shadow 2026-09-25

stages:
  - test
  - sonar

# Default image for Python jobs
default:
  image: python:3.11-slim
  tags:
    - docker

# Cache pip + sonar artifacts between jobs
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
  GIT_DEPTH: "10"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - .sonar
    - .scannerwork

# --- Test Stage ---
test:lint-and-import:
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libsqlite3-dev 2>&1 | tail -2
    - pip install --upgrade pip --quiet
    - pip install -r requirements.txt --quiet
  script:
    - echo "=== Python version ==="
    - python --version
    - pip list | grep -E "(Flask|Werkzeug)"
    - echo "=== Compile check (syntax validation) ==="
    - python -m compileall app/ -q || python -m py_compile app/__init__.py app/__main__.py app/auth.py app/dns_server.py app/routes.py app/database.py
    - echo "=== Flask app instantiation check ==="
    - python -c "from app import create_app; app = create_app(); print('OK')" 2>&1 | tail -5 || echo "create_app check skipped"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

# --- SonarQube Static Analysis ---
sonar:scan:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:5.0.1
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "10"
  script:
    - echo "=== SonarQube scan starting ==="
    - |
      sonar-scanner \
        -Dsonar.projectKey="${SONAR_PROJECT_KEY_PREFIX}-${CI_PROJECT_PATH_SLUG}" \
        -Dsonar.projectName="${CI_PROJECT_TITLE}" \
        -Dsonar.projectVersion="${CI_COMMIT_SHORT_SHA}" \
        -Dsonar.sources="app/" \
        -Dsonar.host.url="${SONAR_HOST_URL}" \
        -Dsonar.token="${SONAR_TOKEN}" \
        -Dsonar.sourceEncoding=UTF-8 \
        -Dsonar.exclusions="**/__pycache__/**,**/db/*.db,**/db/blocklists/*.txt,**/static/**,**/templates/**" \
        -Dsonar.python.version=3.11 \
        -Dsonar.scm.disabled=false
    - echo "=== Scan complete ==="
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

# Manual trigger for ad-hoc scans
sonar:scan-manual:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:5.0.1
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "10"
  script:
    - sonar-scanner -Dsonar.projectKey="${SONAR_PROJECT_KEY_PREFIX}-${CI_PROJECT_PATH_SLUG}-manual" -Dsonar.projectName="${CI_PROJECT_TITLE} (manual)" -Dsonar.sources="app/" -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.token="${SONAR_TOKEN}"
  allow_failure: true
  when: manual
  only:
    - main