<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Koneksaun Saudavel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; }
        .card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .card-body { padding: 2.5rem; }
        .form-control { border-radius: 8px; padding: 0.75rem 1rem; }
        .form-control:focus { border-color: #e63946; box-shadow: 0 0 0 3px rgba(230,57,70,0.15); }
        .btn-primary { background: #e63946; border: none; border-radius: 8px; padding: 0.75rem; font-weight: 600; }
        .btn-primary:hover { background: #c1121f; }
        .btn-primary:focus { box-shadow: 0 0 0 3px rgba(230,57,70,0.3); }
        a { color: #e63946; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .shield { font-size: 48px; filter: drop-shadow(0 2px 8px rgba(220,53,69,0.4)); }
        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1rem;
            z-index: 5;
        }
        .password-toggle:hover { color: #e2e8f0; }
        .input-group.password-input { position: relative; }
        .input-group.password-input .form-control { padding-right: 2.75rem; }
        .input-group.password-input .password-toggle { right: 0.75rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark navbar-dark-custom py-3" style="background:rgba(15,23,42,0.9); border-bottom:1px solid rgba(255,255,255,0.05);">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-shield-check me-2"></i>Koneksaun Saudavel
            </a>
            <div class="d-flex gap-3 align-items-center">
                <a class="nav-link-custom" href="/">Home</a>
                <span id="nav-login"><a class="btn btn-outline-cta btn-sm" href="/login">Login</a></span>
                <span id="nav-dashboard" style="display:none;"><a class="nav-link-custom" href="/dashboard">Dashboard</a></span>
                <span id="nav-logout" style="display:none;">
                    <form id="logout-form-tpl" method="POST" action="/logout" style="display:none;"></form>
                    <a class="nav-link-custom" href="#" onclick="document.getElementById('logout-form-tpl').submit(); return false;" style="color:#f56565;">Logout</a>
                </span>
            </div>
        </div>
    </nav>
    <script>
    fetch('/api/v1/auth/me')
        .then(r => r.json())
        .then(data => {
            if (data.authenticated) {
                document.getElementById('nav-login').style.display = 'none';
                document.getElementById('nav-dashboard').style.display = '';
                document.getElementById('nav-logout').style.display = '';
            }
        })
        .catch(() => {});
    </script>
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card" style="max-width: 400px; width: 100%;">
        <div class="card-body text-center">
            <div class="shield">🜃</div>
            <h3 class="mt-2 mb-1 text-white">Buat Akun</h3>
            <p class="text-muted mb-4">Bergabung dengan Koneksaun Saudavel</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ 'danger' if category == 'error' else category }} py-2" role="alert">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="/register">
                <div class="mb-3 text-start">
                    <label class="form-label text-white-50" style="font-size:0.8rem;">Nama Pengguna</label>
                    <input type="text" name="username" class="form-control" placeholder="Nama Pengguna" required autofocus>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label text-white-50" style="font-size:0.8rem;">Email (opsional)</label>
                    <input type="email" name="email" class="form-control" placeholder="email@contoh.com">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label text-white-50" style="font-size:0.8rem;">Kata Sandi</label>
                    <div class="input-group password-input">
                        <input type="password" name="password" id="reg-password" class="form-control" placeholder="Minimal 6 karakter" required>
                        <button class="password-toggle" type="button" onclick="togglePasswordVisibility('reg-password', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Daftar</button>
            </form>
            <script>
            function togglePasswordVisibility(inputId, btn) {
                const input = document.getElementById(inputId);
                const icon = btn.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'bi bi-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'bi bi-eye';
                }
            }
            </script>

            <p class="mt-4 text-muted small">
                Sudah punya akun? <a href="/login">Masuk</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
