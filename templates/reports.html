{% extends "base.html" %}
{% block title %}My Reports - Koneksaun Saudavel{% endblock %}
{% block page_title %}My Reports{% endblock %}
{% block page_subtitle %}Laporan yang Anda kirimkan{% endblock %}
{% block content %}
<div class="content-card">
            <div class="card-header"><i class="bi bi-flag me-2"></i>Laporan Saya</div>
            <div class="card-body p-0"><table class="table mb-0"><thead><tr><th>Domain</th><th>Kategori</th><th>Status</th><th>Dikirim</th></tr></thead><tbody id="reports-body"><tr><td colspan="4" class="text-center text-muted py-4">Memuat...</td></tr></tbody></table></div>
        </div>
        <script>
        async function loadReports() {
            const r = await fetch('/api/v1/reports/mine');
            const d = await r.json();
            const tb = document.getElementById('reports-body');
            if(d.reports&&d.reports.length){tb.innerHTML=d.reports.map(r=>'<tr><td><code>'+r.domain+'</code></td><td><span class="badge badge-rejected">'+r.category+'</span></td><td><span class="badge badge-'+r.status+'">'+r.status+'</span></td><td style="font-size:0.8rem;color:#64748b;">'+(r.created_at||'')+'</td></tr>').join('');}else{tb.innerHTML='<tr><td colspan="4" class="text-center text-muted py-4">Belum ada laporan dikirim</td></tr>';
        }
        loadReports();
        </script>
{% endblock %}
