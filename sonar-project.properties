# SonarQube project configuration
# Override per-project or use with sonar-scanner CLI args

sonar.projectKey=telkomcel-koneksaun-saudavel
sonar.projectName=Koneksaun Saudavel
sonar.projectVersion=1.0
sonar.sources=app/
sonar.sourceEncoding=UTF-8

# Python specific
sonar.python.version=3.11

# Exclusions
sonar.exclusions=**/__pycache__/**,**/db/*.db,**/db/blocklists/*.txt,**/static/**,**/templates/**

# Host URL + token (will be overridden by sonar-scanner CLI args from CI)
# sonar.host.url=https://sonar.telkomcel.tl
# sonar.token=***